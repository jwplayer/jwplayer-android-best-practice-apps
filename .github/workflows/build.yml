name: Build sample apps

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the build still running for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: apps
        # Every top-level folder with its own settings.gradle(.kts) is a sample app.
        run: echo "apps=$(for d in */; do if [ -f "${d}settings.gradle" ] || [ -f "${d}settings.gradle.kts" ]; then echo "${d%/}"; fi; done | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.list.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      # Check the app's gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build ${{ matrix.app }}
        working-directory: ${{ matrix.app }}
        run: sh ./gradlew assembleDebug
